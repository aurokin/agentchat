name: Host Guardrails Manual

on:
    workflow_dispatch:

jobs:
    host-guardrails:
        runs-on: ubuntu-latest
        env:
            HOME: ${{ runner.temp }}/agentchat-home
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.8"

            - name: Prepare fake host home
              run: mkdir -p "$HOME"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Validate host scripts
              run: bash -n scripts/host/*.sh

            - name: Prepare stable install scaffold
              run: scripts/host/install-stable.sh

            - name: Verify generated stable scaffold
              run: |
                  test -f "$HOME/code/agentchat/stable/apps/web/.env.local"
                  test -f "$HOME/code/agentchat/stable/apps/server/.env.local"
                  test -f "$HOME/code/agentchat/stable/apps/server/agentchat.config.json"
                  test -f "$HOME/code/agentchat/stable/apps/web/.next/BUILD_ID"

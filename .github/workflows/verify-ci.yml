name: Verify CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.8"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run repo verification
              run: bun run lint:repo

            - name: Run typecheck
              run: bun run typecheck

            - name: Run lint
              run: bun run lint

            - name: Run web tests
              timeout-minutes: 5
              run: bun run --cwd apps/web test

            - name: Run server tests
              timeout-minutes: 5
              run: bun run --cwd apps/server test

            - name: Run mobile tests
              timeout-minutes: 5
              run: bun run --cwd apps/mobile test

            - name: Run shared tests
              timeout-minutes: 5
              run: bun run --cwd packages/shared test

            - name: Run convex tests
              timeout-minutes: 5
              run: bun run --cwd packages/convex test

            - name: Run script tests
              timeout-minutes: 5
              run: bun run test:scripts

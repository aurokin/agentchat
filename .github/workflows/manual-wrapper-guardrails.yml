name: Manual Wrapper Guardrails

on:
    workflow_dispatch:

jobs:
    wrapper-guardrails:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.8"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run repo guardrails
              run: |
                  bun run docs:check
                  bun run env:check
                  bun run health:web
                  bun run health:server

            - name: Bootstrap current checkout
              run: |
                  bun run bootstrap -- --no-install
                  bun run status
                  bun run config:print

            - name: Exercise worktree lifecycle
              run: |
                  bun run worktree:create -- gha-wrapper-guardrail
                  ../gha-wrapper-guardrail/bun run status
                  ../gha-wrapper-guardrail/bun run config:print
                  bun run worktree:remove -- gha-wrapper-guardrail --force
